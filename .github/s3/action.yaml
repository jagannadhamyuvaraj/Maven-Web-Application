name: Upload to S3
description: Upload a file to an AWS S3 bucket

inputs:
  file:
    description: Path to the file or directory in the checked-out workspace
    required: true
  bucket:
    description: Destination S3 bucket
    required: true
  destination-prefix:
    description: optional s3 key prefix
    required: false
    default: ""
  aws-region:
    description: AWS region for the bucket
    required: true
  aws-access-key-id:
    description: AWS access key ID
    required: true
  aws-secret-access-key:
    description: AWS secret access key
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Upload file to S3
      shell: bash
      env:
        SOURCE: ${{ inputs.file }}
        S3_BUCKET: ${{ inputs.bucket }}
        PREFIX: ${{ inputs.destination-prefix }}
      run: |
        set -euo pipefail

        if [[ ! -e "$SOURCE" ]]; then
          echo "::error::source path does not exist: $SOURCE"
          exit 1
        fi

        # Remove trailing slash if present from the base bucket string
        destination="s3://${S3_BUCKET%/}"

        # Cleanly append prefix if provided, removing any leading/trailing slashes from the prefix
        if [[ -n "$PREFIX" ]]; then
          clean_prefix="${PREFIX#/}"
          clean_prefix="${clean_prefix%/}"
          destination="${destination}/${clean_prefix}"
        fi

        if [[ -d "$SOURCE" ]]; then
          echo "Uploading directory: $SOURCE to $destination"
          aws s3 cp "$SOURCE" "$destination" --recursive
        elif [[ -f "$SOURCE" ]]; then
          filename="$(basename "$SOURCE")"
          echo "Uploading file: $SOURCE to ${destination}/${filename}"
          aws s3 cp "$SOURCE" "${destination}/${filename}"
        else
          echo "::error::Source must be a regular file or directory: $SOURCE"
          exit 1
        fi
