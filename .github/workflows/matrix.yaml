name: Matrix Demo

on: workflow_dispatch

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 14, 16, 18 ]

    steps:
      - name: check os and node version
        run: |
          echo "Running on ${{ matrix.os }}
          echo "Using Node.js ${{ matrix.node-version }}
