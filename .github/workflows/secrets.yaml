# This workflow describes how we can fetech the secrets from secret manager
name: Fetch AWS secret

on:
  workflow_dispatch:

jobs:
  fetch-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_id }}
            aws-secret-access-key: ${{ secrets.AWS_SECRETS_ACCESS_KEY }}
            aws-region: us-east-1

      - name: fetech secret from AWS secrets Manager
        uses: aws.actions/aws-secretsmanager-get-secrets@v1
        id: fetch_secret
        with:
            secret-ids: MySecretName
          # run: |
            # SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id MySecretName  --query Secretstring --output )
            # echo "secret_value=$SECRET_VALUE" >> $GITHUB_OUTPUT

      - name: use secret value
        run: |
          echo "Fetech secret: ${{ steps.fetch_secret.outputs.secret_value }}"
