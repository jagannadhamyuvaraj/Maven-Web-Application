#resuable workflow

name: Reusable workflow for ecs deployment
on:
  workflow_call:  # This indicates this is a resuable workflow
    inputs:
      node-version:
        required: false
        type: string
        default: '18'
      run-tests:
        required: false
        type: boolean
        default: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: npm run dev
          
