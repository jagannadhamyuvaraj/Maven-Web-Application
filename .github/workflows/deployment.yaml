name: CICD pipeline

on:
  push:
    branches:
    - k8s
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v4

    - name: setup java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: build maven package
      run: mvn clean package

    - name: build docker image
      run: docker build -t 864780126718.dkr.ecr.us-east-1.amazonaws.com/login:${{github.run_number}} .

    - name: configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}} 

    - name: Authenticate with AWS ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Push Docker image to AWS ecr
      run: docker push 864780126718.dkr.ecr.us-east-1.amazonaws.com/login:${{github.run_number}}

    - name: update image tag in kubernetes manifest
      run:
        sed -i 's/Build_Tag/${buildNumber}/g' MavenWebApplication.yaml'

    - name : configure kubeconfig
      run:
        aws eks update-kubeconfig --name Amazon_Production_EKS_Cluster --region us-east-1

    - name: deploy to Amazon_Production_EKS_Cluster
      run:
        kubectl delete deployment webpage-deployment -n production || true
        kubectl apply -f MavenWebApplication.yaml
