# This pipeline defines how to access env variables in the workflows
name: workflow for env variables

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_ENV: production  #defined at workflow level
  API_TIMEOUT: 30
  CUSTOM_VARIABLE: dev
  

jobs:
  environment-demo:
    runs-on: ubuntu-latest
    environment: production     #defined at job level. These must set at repository level to access
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: show environment variables
        run: |
          echo "java environment: $NODE_ENV"
          echo "API timeout: $API_TIMEOUT"
          echo "Custom var: $CUSTOM_VARIABLE"

      - name: Use different env per step
        run: | 
          echo "step specific variables: $STEP_VAR"
        env: 
          STEP_VAR: "step-value"
