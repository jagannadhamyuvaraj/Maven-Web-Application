name: Pull Request workflow

on: 
  pull_request:
    types: [opened, synchronize, closed ]

jobs:
  pr_job:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: steup java
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache: 'maven'
          
      - name: Java version
        run: java --version

      - name: Build and test with maven
        run: mvn clean verify
          

      
  
